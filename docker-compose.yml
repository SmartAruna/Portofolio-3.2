services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rasaria
      POSTGRES_USER: rasaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasaria -d rasaria"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://rasaria:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file}@db:5432/rasaria
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      ORDER_RATE_LIMIT: ${ORDER_RATE_LIMIT:-10}
      ORDER_RATE_WINDOW_SECONDS: ${ORDER_RATE_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
